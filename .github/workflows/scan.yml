# Every 15 minutes: fetch prices, compute the signals, build the static site, publish it on GitHub Pages.
# GitHub's schedule is best effort and often drops runs, so each run publishes four rounds about 15 minutes apart
# (scan-round.yml); two schedule slots per hour keep it going if one is dropped. Public repository: runner minutes
# are free. If a round fails, the last published site stays up.
name: scan and publish
on:
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  round1:
    uses: ./.github/workflows/scan-round.yml
    with: {round: "1", wait_min: 0}
  round2:
    needs: round1
    if: ${{ always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/scan-round.yml
    with: {round: "2", wait_min: 11}
  round3:
    needs: round2
    if: ${{ always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/scan-round.yml
    with: {round: "3", wait_min: 11}
  round4:
    needs: round3
    if: ${{ always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/scan-round.yml
    with: {round: "4", wait_min: 11}
