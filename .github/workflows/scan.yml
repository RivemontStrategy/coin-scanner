# Every 30 minutes: fetch prices, compute the signals, build the static site, publish it on GitHub Pages.
# Public repository: GitHub-hosted runner minutes are free. If a run fails, the last published site stays up.
name: scan and publish
on:
  schedule:
    - cron: "7,37 * * * *"        # twice an hour, off the busy top of the hour
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Scan and build the site
        run: python -m scanner.build --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
